<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">REFAL-SUPERSYSTEM</title>
  <desc id="d">A self-hosting Refal-5 compiler, supercompiler, reflection engine and meta-prover in Rust: Valentin Turchin's four-layer supersystem.</desc>
  <rect x="0" y="0" width="1280" height="640" rx="0" fill="#0D1117"/>
  <rect x="0" y="0" width="10" height="640" rx="0" fill="#14B8A6"/>
  <text x="72" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3.4" fill="#14B8A6">VALENTIN TURCHIN'S 1991 SUPERSYSTEM · IMPLEMENTED IN RUST</text>
  <text x="66" y="214" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#E6EDF3">REFAL-SUPERSYSTEM</text>
  <text x="72" y="272" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">A compiler that compiles itself. A prover that decides by supercompilation.</text>
  <text x="72" y="306" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">One engine, four layers, one shared expression space — in Rust.</text>
  <rect x="72" y="358" width="219" height="54" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="90" y="393" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#14B8A6">L0</text>
  <text x="134" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E6EDF3">Refal-5 machine</text>
  <rect x="305" y="358" width="239.39999999999998" height="54" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="323" y="393" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#14B8A6">L1</text>
  <text x="367" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E6EDF3">Reflection engine</text>
  <rect x="558.4" y="358" width="198.6" height="54" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="576.4" y="393" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#14B8A6">L2</text>
  <text x="620.4" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E6EDF3">Supercompiler</text>
  <rect x="771" y="358" width="178.2" height="54" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="789" y="393" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#14B8A6">L3</text>
  <text x="833" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E6EDF3">Meta-prover</text>
  <rect x="963.2" y="358" width="229.2" height="54" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="981.2" y="393" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#14B8A6">L4</text>
  <text x="1025.2" y="392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E6EDF3">Self-application</text>
  <rect x="72" y="448" width="1136" height="78" rx="14" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <text x="100" y="486" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="600" fill="#99F6E4">102,436-byte self-hosting fixpoint</text>
  <text x="100" y="514" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8B949E">the compiler's own source compiles to itself, byte for byte</text>
  <text x="1180" y="486" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="600" fill="#2DD4BF">~90.5%</text>
  <text x="1180" y="514" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" text-anchor="end" fill="#8B949E">of the four layers, behind green gates</text>
  <text x="72" y="588" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="600" fill="#14B8A6">github.com/Abhinav-Rust/REFAL-SUPERSYSTEM</text>
</svg>
