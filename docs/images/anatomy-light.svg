<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
  <title id="t">Refal in one sentence</title>
  <desc id="d">A Reverse function written in Refal, annotated with what each variable kind and the call brackets mean.</desc>
  <rect x="0.5" y="0.5" width="1199" height="391" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#0F766E">REFAL IN ONE SENTENCE</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#1F2328">A function is a set of  pattern = result  rules</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#D0D7DE" stroke-width="1"/>
  <rect x="40" y="140" width="640" height="176" rx="14" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <text x="64" y="182" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2328">Reverse {</text>
  <text x="64" y="212" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#0F766E">  =  ;                                  </text>
  <text x="64" y="242" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#1F2328">  s.Head e.Rest = &lt;Reverse e.Rest&gt; s.Head;</text>
  <text x="64" y="272" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#1F2328">}</text>
  <rect x="712" y="158" width="66" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="745" y="176" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#0F766E">s.</text>
  <text x="794" y="176" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">one symbol</text>
  <rect x="712" y="192" width="66" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="745" y="210" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#0F766E">e.</text>
  <text x="794" y="210" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">zero or more terms</text>
  <rect x="712" y="226" width="66" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="745" y="244" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#0F766E">t.</text>
  <text x="794" y="244" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">one term (may be a bracket)</text>
  <rect x="712" y="260" width="66" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="745" y="278" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#0F766E">&lt; … &gt;</text>
  <text x="794" y="278" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">a call</text>
  <rect x="712" y="294" width="66" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="745" y="312" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#0F766E">=</text>
  <text x="794" y="312" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">separates pattern from result</text>
  <rect x="40" y="340" width="1120" height="44" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="64" y="368" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#134E4A">Variables carry their type in the prefix, and matching is structural: the pattern decides which sentence runs.</text>
</svg>
