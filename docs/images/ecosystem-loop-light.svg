  <text x="886" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#1F2328">Inspect</text>
  <text x="848" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">Explore symbolic entry</text>
  <text x="848" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">configurations and successors.</text>
  <text x="848" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#0F766E">AVAILABLE TOOLING</text>
  <rect x="824" y="390" width="336" height="140" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="857" cy="426" r="17" fill="#FFFFFF"/>
  <text x="857" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#B45309">04</text>
  <text x="886" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#1F2328">Transform</text>
  <text x="848" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">Drive the program and</text>
  <text x="848" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">emit residual Refal.</text>
  <text x="848" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#B45309">EXPERIMENTAL TRANSFORMATION</text>
  <rect x="432" y="390" width="336" height="140" rx="18" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="465" cy="426" r="17" fill="#FFFFFF"/>
  <text x="465" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0F766E">05</text>
  <text x="494" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#1F2328">Compare</text>
  <text x="456" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">Compare source and generated</text>
  <text x="456" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">outputs on concrete inputs.</text>
  <text x="456" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#0F766E">AVAILABLE TOOLING</text>
  <rect x="40" y="390" width="336" height="140" rx="18" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="73" cy="426" r="17" fill="#FFFFFF"/>
  <text x="73" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0F766E">06</text>
  <text x="102" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#1F2328">Run</text>
  <text x="64" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">Execute the program with</text>
  <text x="64" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">its runtime inputs.</text>
  <text x="64" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#0F766E">AVAILABLE TOOLING</text>
  <text x="600" y="354" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#57606A">Inspect the artifacts and compare their behavior.</text>
  <text x="42" y="594" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#57606A">Source, generated programs, and observations remain available for inspection.</text>
