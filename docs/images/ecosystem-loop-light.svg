<g>  <line x1="208" y1="390" x2="208" y2="315" stroke="#0D9488" stroke-width="2"/><path d="M 208 306 L 212 315 L 204 315 Z" fill="#0D9488"/></g>
  <rect x="40" y="166" width="336" height="140" rx="18" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="73" cy="202" r="17" fill="#FFFFFF"/>
  <text x="73" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0F766E">01</text>
  <text x="102" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#1F2328">Write</text>
  <text x="64" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">Describe functions and</text>
  <text x="64" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">their patterns in Refal.</text>
  <text x="64" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#0F766E">AVAILABLE TOOLING</text>
  <rect x="432" y="166" width="336" height="140" rx="18" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="465" cy="202" r="17" fill="#FFFFFF"/>
  <text x="465" y="207" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0F766E">02</text>
  <text x="494" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#1F2328">Check</text>
  <text x="456" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">Parse the source and</text>
  <text x="456" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#1F2328">inspect static diagnostics.</text>
  <text x="456" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#0F766E">AVAILABLE TOOLING</text>
  <rect x="824" y="166" width="336" height="140" rx="18" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="857" cy="202" r="17" fill="#FFFFFF"/>
