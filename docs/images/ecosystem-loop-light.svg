<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 636" width="1200" height="636" role="img" aria-labelledby="t d">
  <title id="t">The Refal tool workflow</title>
  <desc id="d">Write and check a Refal program, inspect symbolic configurations, use experimental specialization to generate residual Refal, compare concrete outputs, and execute the resulting program.</desc>
  <rect x="0.5" y="0.5" width="1199" height="635" rx="24" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
