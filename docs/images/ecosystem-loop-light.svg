  <text x="40" y="111" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.7" fill="#1F2328">From source to generated programs</text>
<g>  <line x1="376" y1="236" x2="423" y2="236" stroke="#0D9488" stroke-width="2"/><path d="M 432 236 L 423 240 L 423 232 Z" fill="#0D9488"/></g>
