  <text x="40" y="111" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.7" fill="#E6EDF3">From ideas to evidence, and back to people</text>
