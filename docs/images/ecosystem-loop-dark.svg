  <rect x="432" y="390" width="336" height="140" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="465" cy="426" r="17" fill="#0D1117"/>
  <text x="465" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#8B949E">05</text>
  <text x="494" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Connect</text>
  <text x="456" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Version knowledge and</text>
  <text x="456" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">its supporting evidence.</text>
  <text x="456" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8B949E">NETWORK INTEGRATION TO BUILD</text>
  <rect x="40" y="390" width="336" height="140" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="73" cy="426" r="17" fill="#0D1117"/>
  <text x="73" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#8B949E">06</text>
  <text x="102" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Review</text>
  <text x="64" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Let contributors compare,</text>
  <text x="64" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">revise, and refine.</text>
  <text x="64" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8B949E">NETWORK INTEGRATION TO BUILD</text>
  <text x="600" y="354" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#8B949E">Evidence returns to people; people refine the models.</text>
  <text x="42" y="594" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8B949E">The engine exists. Persistent knowledge, evidence, and collaboration services remain to be built.</text>
