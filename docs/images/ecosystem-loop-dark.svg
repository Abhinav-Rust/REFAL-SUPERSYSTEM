<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 636" width="1200" height="636" role="img" aria-labelledby="t d">
  <title id="t">The intended knowledge and computation loop</title>
  <desc id="d">Describe concepts and cite sources, formalize claims as models, transform and execute with Refal, check evidence, connect versioned knowledge, and let contributors review it. The engine is implemented with repairs open; the network integrations are planned.</desc>
