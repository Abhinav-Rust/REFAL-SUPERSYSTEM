  <text x="886" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Inspect</text>
  <text x="848" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Explore symbolic entry</text>
  <text x="848" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">configurations and successors.</text>
  <text x="848" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#2DD4BF">AVAILABLE TOOLING</text>
  <rect x="824" y="390" width="336" height="140" rx="18" fill="#2B1D06" stroke="#7C4A03" stroke-width="1.5"/>
  <circle cx="857" cy="426" r="17" fill="#0D1117"/>
  <text x="857" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#F59E0B">04</text>
  <text x="886" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Transform</text>
  <text x="848" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Drive the program and</text>
  <text x="848" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">emit residual Refal.</text>
  <text x="848" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#F59E0B">EXPERIMENTAL TRANSFORMATION</text>
  <rect x="432" y="390" width="336" height="140" rx="18" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <circle cx="465" cy="426" r="17" fill="#0D1117"/>
  <text x="465" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2DD4BF">05</text>
  <text x="494" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Compare</text>
  <text x="456" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Compare source and generated</text>
  <text x="456" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">outputs on concrete inputs.</text>
  <text x="456" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#2DD4BF">AVAILABLE TOOLING</text>
  <rect x="40" y="390" width="336" height="140" rx="18" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <circle cx="73" cy="426" r="17" fill="#0D1117"/>
  <text x="73" y="431" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2DD4BF">06</text>
  <text x="102" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Run</text>
  <text x="64" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Execute the program with</text>
  <text x="64" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">its runtime inputs.</text>
  <text x="64" y="517" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#2DD4BF">AVAILABLE TOOLING</text>
  <text x="600" y="354" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#8B949E">Inspect the artifacts and compare their behavior.</text>
  <text x="42" y="594" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8B949E">Source, generated programs, and observations remain available for inspection.</text>
