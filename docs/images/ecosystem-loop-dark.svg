  <text x="886" y="436" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Check</text>
  <text x="848" y="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Retain results, proof checks,</text>
  <text x="848" y="495" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">and counterexample inputs.</text>
