  <text x="102" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Describe</text>
  <text x="64" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Concepts and claims</text>
  <text x="64" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">with original sources.</text>
  <text x="64" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8B949E">NETWORK INTEGRATION TO BUILD</text>
