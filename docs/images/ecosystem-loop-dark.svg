  <text x="102" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Write</text>
  <text x="64" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Describe functions and</text>
  <text x="64" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">their patterns in Refal.</text>
  <text x="64" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#2DD4BF">AVAILABLE TOOLING</text>
  <rect x="432" y="166" width="336" height="140" rx="18" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <circle cx="465" cy="202" r="17" fill="#0D1117"/>
