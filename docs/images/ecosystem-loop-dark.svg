  <text x="494" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Formalize</text>
  <text x="456" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Connect each claim to</text>
  <text x="456" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">a model and its domain.</text>
  <text x="456" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8B949E">NETWORK INTEGRATION TO BUILD</text>
