  <text x="494" y="212" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#E6EDF3">Check</text>
  <text x="456" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">Parse the source and</text>
  <text x="456" y="271" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#E6EDF3">inspect static diagnostics.</text>
  <text x="456" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#2DD4BF">AVAILABLE TOOLING</text>
  <rect x="824" y="166" width="336" height="140" rx="18" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
