  <text x="60" y="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">How do I start?</text>
  <text x="60" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">one toolchain, three commands</text>
  <rect x="328" y="274" width="272" height="118" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="348" y="308" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" text-anchor="start" fill="#0F766E">06</text>
  <text x="348" y="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">What can it do?</text>
  <text x="348" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">twenty-four commands, one per</text>
  <text x="348" y="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">capability</text>
  <rect x="616" y="274" width="272" height="118" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="636" y="308" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" text-anchor="start" fill="#0F766E">07</text>
  <text x="636" y="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Why does it exist?</text>
  <text x="636" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Turchin's corpus, and what</text>
  <text x="636" y="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">each layer reads</text>
  <rect x="904" y="274" width="272" height="118" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <text x="924" y="308" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700" text-anchor="start" fill="#0F766E">08</text>
  <text x="924" y="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">I have a question</text>
  <text x="924" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">the answers this project is</text>
  <text x="924" y="380" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">searched with</text>
  <rect x="40" y="416" width="1120" height="44" rx="12" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <text x="64" y="444" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#99F6E4">Every section below opens with a picture; the prose under it says only what the picture cannot.</text>
