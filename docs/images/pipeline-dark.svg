<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">How a Refal program is compiled: lex, parse, check, drive, emit</title>
  <desc id="pipe-desc">Five stages left to right: the source file hello.ref, lexing and parsing into a syntax tree, checking to refuse what cannot run, driving the configuration into a graph of states, and emitting a residual program. The driving stage is highlighted, because it is what makes this a supercompiler rather than a printer.</desc>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="#0D1117" stroke="#30363D"/>

  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#2DD4BF">THE COMPILER&#8217;S DEFAULT PATH</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#E6EDF3">It does not re-print the program. It <tspan fill="#2DD4BF">drives</tspan> it.</text>

  <line x1="40" y1="112" x2="1160" y2="112" stroke="#30363D" stroke-width="1"/>

  <g>
    <rect x="40" y="152" width="150" height="96" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="115" y="184" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8B949E">SOURCE</text>
    <text x="115" y="212" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#E6EDF3">hello.ref</text>
    <text x="115" y="234" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">Refal-5</text>
  </g>

  <g stroke="#6E7681" stroke-width="1.6" fill="none">
    <path d="M 198 200 L 218 200"/><path d="M 212 195 L 219 200 L 212 205"/>
    <path d="M 421 200 L 441 200"/><path d="M 435 195 L 442 200 L 435 205"/>
    <path d="M 644 200 L 664 200"/><path d="M 658 195 L 665 200 L 658 205"/>
    <path d="M 942 200 L 962 200"/><path d="M 956 195 L 963 200 L 956 205"/>
  </g>

  <g>
    <rect x="228" y="152" width="185" height="96" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
    <text x="320" y="184" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#2DD4BF">LEX + PARSE</text>
    <text x="320" y="210" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3">tokens &#8594; tree</text>
    <text x="320" y="232" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">the whole Classic grammar</text>
  </g>

  <g>
    <rect x="451" y="152" width="185" height="96" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
    <text x="543" y="184" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#2DD4BF">CHECK</text>
    <text x="543" y="210" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3">refuse the broken</text>
    <text x="543" y="232" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">a proven defect never ships</text>
  </g>

  <g>
    <rect x="674" y="140" width="260" height="120" rx="14" fill="#0F766E" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="804" y="176" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#99F6E4">DRIVE</text>
    <text x="804" y="204" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#FFFFFF">the graph of states</text>
    <text x="804" y="228" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CCFBF1">the dispatch moves from run time</text>
    <text x="804" y="246" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#CCFBF1">to drive time</text>
  </g>

  <g>
    <rect x="972" y="152" width="185" height="96" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
    <text x="1064" y="184" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#2DD4BF">EMIT</text>
    <text x="1064" y="210" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#E6EDF3">a residual program</text>
    <text x="1064" y="232" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">which no longer calls the original</text>
  </g>

  <line x1="40" y1="284" x2="1160" y2="284" stroke="#30363D" stroke-width="1"/>
  <text x="40" y="306" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">A function that chose between sentences at run time is replaced by a generated <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5EEAD4">Split</tspan> whose sentences are the exhaustive, pairwise-disjoint partition.</text>
</svg>
