  <g><line x1="905" y1="478" x2="923" y2="478" stroke="#0F766E" stroke-width="2"/><path d="M 923 474.25 L 929 478 L 923 481.75 Z" fill="#0F766E"/></g>
  <rect x="932" y="452" width="188" height="52" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="1026" y="484" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1F2328">generation 2</text>
  <text x="60" y="534" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">The two generations are compared byte for byte. Equal output is the claim; a supercompiler that merely re-prints its input would pass it trivially, so the emitted program is also run.</text>
  <rect x="40" y="592" width="1120" height="44" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="64" y="620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#134E4A">Every column is a crate and a command; every command is behind a test. The compiler in Refal lives in the corpus because it is the artifact under test, not the verifier.</text>
</svg>
