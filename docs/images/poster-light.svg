  <g><line x1="687" y1="478" x2="705" y2="478" stroke="#0F766E" stroke-width="2"/><path d="M 705 474.25 L 711 478 L 705 481.75 Z" fill="#0F766E"/></g>
  <rect x="714" y="452" width="188" height="52" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
