<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">The whole repository in one picture</title>
  <desc id="d">Four layer columns, L0 the Refal-5 machine, L1 the reflection engine, L2 the supercompiler core and L3 the meta-prover, each with the crate that implements it and the command that exercises it, above a self-application loop in which the compiler compiles its own source twice and the two generations must be identical.</desc>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#0F766E">ONE PAGE</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#1F2328">The whole repository, in one picture</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#D0D7DE" stroke-width="1"/>
  <rect x="40" y="140" width="272" height="236" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="60" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#0F766E">L0</text>
  <text x="60" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328">Refal-5 machine</text>
  <text x="60" y="226" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">runs a Refal program</text>
  <line x1="60" y1="268" x2="292" y2="268" stroke="#99F6E4" stroke-width="1"/>
  <text x="60" y="292" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#57606A">refal-runtime</text>
  <text x="60" y="316" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#0F766E">refal run</text>
  <circle cx="286.0" cy="310.0" r="5" fill="#0F766E"/>
  <text x="60" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">built and gated</text>
  <g><line x1="315" y1="258" x2="319" y2="258" stroke="#0F766E" stroke-width="2"/><path d="M 319 254.25 L 325 258 L 319 261.75 Z" fill="#0F766E"/></g>
  <rect x="328" y="140" width="272" height="236" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="348" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#0F766E">L1</text>
  <text x="348" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328">Reflection engine</text>
  <text x="348" y="226" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">turns the running program into</text>
  <text x="348" y="242" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">data</text>
  <line x1="348" y1="268" x2="580" y2="268" stroke="#99F6E4" stroke-width="1"/>
  <text x="348" y="292" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#57606A">refal-core</text>
  <text x="348" y="316" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#0F766E">refal reflect</text>
  <circle cx="574.0" cy="310.0" r="5" fill="#0F766E"/>
  <text x="348" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">built and gated</text>
  <g><line x1="603" y1="258" x2="607" y2="258" stroke="#0F766E" stroke-width="2"/><path d="M 607 254.25 L 613 258 L 607 261.75 Z" fill="#0F766E"/></g>
  <rect x="616" y="140" width="272" height="236" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
