  <text x="636" y="292" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#57606A">refal-core</text>
  <text x="636" y="316" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#0F766E">refal compile</text>
  <circle cx="862.0" cy="310.0" r="5" fill="#0F766E"/>
  <text x="636" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">built and gated</text>
  <g><line x1="891" y1="258" x2="895" y2="258" stroke="#0F766E" stroke-width="2"/><path d="M 895 254.25 L 901 258 L 895 261.75 Z" fill="#0F766E"/></g>
  <rect x="904" y="140" width="272" height="236" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="924" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#0F766E">L3</text>
  <text x="924" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328">Meta-prover</text>
  <text x="924" y="226" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">decides what the better</text>
  <text x="924" y="242" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">program means</text>
  <line x1="924" y1="268" x2="1156" y2="268" stroke="#FDE68A" stroke-width="1"/>
  <text x="924" y="292" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#57606A">refal-core</text>
  <text x="924" y="316" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#B45309">refal prove</text>
  <circle cx="1150.0" cy="310.0" r="5" fill="#B45309"/>
  <text x="924" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">partial — names its gap</text>
  <rect x="40" y="400" width="1120" height="160" rx="14" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <text x="60" y="430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#0F766E">L4 · SELF-APPLICATION</text>
  <rect x="60" y="452" width="188" height="52" rx="10" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
