<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 504" width="1200" height="504" role="img" aria-labelledby="t d">
  <title id="t">See it work</title>
  <desc id="d">Four result cards: the self-hosting fixpoint at 105,078 bytes, the metasystem transition at 172 to 4 steps, the strict checker catching a proven defect, and the meta-prover proving associativity.</desc>
  <rect x="0.5" y="0.5" width="1199" height="503" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#0F766E">SEE IT WORK</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#1F2328">Four results — each one a command in this checkout</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#D0D7DE" stroke-width="1"/>
  <rect x="40" y="140" width="540" height="142" rx="14" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="140" width="4" height="142" rx="2" fill="#0F766E"/>
  <text x="64" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#0F766E">SELF-HOSTING FIXPOINT</text>
  <text x="64" y="204" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#1F2328">105,078 bytes</text>
  <text x="64" y="228" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">gen1 == gen2, byte for byte</text>
  <text x="64" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">The compiler compiles its own source, and compiling the</text>
  <text x="64" y="265" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">result again changes nothing at all.</text>
  <rect x="468" y="156" width="92" height="26" rx="13" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="484" cy="169" r="4.5" fill="#0F766E"/>
  <text x="494" y="173" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F766E">Built</text>
  <rect x="600" y="140" width="540" height="142" rx="14" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="600" y="140" width="4" height="142" rx="2" fill="#0F766E"/>
  <text x="624" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#0F766E">METASYSTEM TRANSITION</text>
  <text x="624" y="204" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#1F2328">172 → 4 steps</text>
  <text x="624" y="228" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">the interpreter disappears</text>
  <text x="624" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">An interpreter driven over a program comes back as</text>
  <text x="624" y="265" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">specialised code, not as a trace.</text>
  <rect x="1028" y="156" width="92" height="26" rx="13" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="1044" cy="169" r="4.5" fill="#0F766E"/>
  <text x="1054" y="173" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F766E">Built</text>
  <rect x="40" y="300" width="540" height="142" rx="14" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="300" width="4" height="142" rx="2" fill="#0F766E"/>
  <text x="64" y="328" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#0F766E">STRICT CHECKER</text>
  <text x="64" y="364" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#1F2328">proven defect</text>
  <text x="64" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">refuses what cannot run</text>
  <text x="64" y="410" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">--classic accepts exactly what Refal-5 accepts; --strict</text>
  <text x="64" y="425" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">adds the deny-by-default lints.</text>
  <rect x="468" y="316" width="92" height="26" rx="13" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="484" cy="329" r="4.5" fill="#0F766E"/>
  <text x="494" y="333" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0F766E">Built</text>
  <rect x="600" y="300" width="540" height="142" rx="14" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="600" y="300" width="4" height="142" rx="2" fill="#B45309"/>
  <text x="624" y="328" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#B45309">META-PROVER</text>
  <text x="624" y="364" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="600" fill="#1F2328">proved</text>
  <text x="624" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">associativity, by folding</text>
  <text x="624" y="410" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">An equation over free variables is decided by folding a</text>
  <text x="624" y="425" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57606A">branch to a renaming of the claim.</text>
  <rect x="1028" y="316" width="92" height="26" rx="13" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="1044" cy="329" r="4.5" fill="#B45309"/>
  <text x="1054" y="333" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#B45309">Partial</text>
  <rect x="40" y="452" width="1120" height="44" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="64" y="480" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#134E4A">Every number is a command you can run here; nothing is a mock-up. “refal” is  cargo run -p refal --  or the built  target/release/refal.</text>
</svg>
