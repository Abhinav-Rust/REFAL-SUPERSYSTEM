<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 462" width="1200" height="462" role="img" aria-labelledby="t d">
  <title id="t">Four tools, or one engine?</title>
  <desc id="d">Two panels. On the left, the conventional architecture: an interpreter, a compiler, a supercompiler and a theorem prover as four disconnected tools that pass serialised files. On the right, this repository: one engine whose four layers, L0 the Refal-5 machine, L1 the reflection engine, L2 the supercompiler core and L3 the meta-prover, all work over a single shared expression space.</desc>
  <rect x="0.5" y="0.5" width="1199" height="461" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#0F766E">THE THESIS</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#1F2328">Four separate tools, or one engine?</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#D0D7DE" stroke-width="1"/>
  <rect x="40" y="140" width="545" height="240" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
  <text x="60" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.0" fill="#6E7781">FOUR DISCONNECTED TOOLS</text>
  <rect x="60" y="176" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="76" y="197" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#57606A">An interpreter</text>
  <text x="160" y="220" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6E7781">↓</text>
  <rect x="60" y="224" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="76" y="245" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#57606A">A compiler</text>
  <text x="160" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6E7781">↓</text>
  <rect x="60" y="272" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="76" y="293" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#57606A">A supercompiler</text>
  <text x="160" y="316" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6E7781">↓</text>
  <rect x="60" y="320" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="76" y="341" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#57606A">A theorem prover</text>
  <text x="288" y="206" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">Each tool reads and writes the</text>
  <text x="288" y="224" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">next one's files, so the program</text>
  <text x="288" y="242" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">is copied and re-parsed at every</text>
  <text x="288" y="260" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57606A">boundary.</text>
  <rect x="615" y="140" width="545" height="240" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="635" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.0" fill="#0F766E">ONE ENGINE, ONE EXPRESSION SPACE</text>
  <rect x="635" y="186" width="505" height="168" rx="12" fill="#F6FEFC" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="655" y="196" width="465" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="671" y="214" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#134E4A">L0 · the Refal-5 machine</text>
  <rect x="655" y="228" width="465" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="671" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#134E4A">L1 · the reflection engine</text>
  <rect x="655" y="260" width="465" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="671" y="278" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#134E4A">L2 · the supercompiler core</text>
  <rect x="655" y="292" width="465" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="671" y="310" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#134E4A">L3 · the meta-prover</text>
  <rect x="655" y="320" width="465" height="26" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
  <text x="887.5" y="338" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0F766E">one shared expression space</text>
  <rect x="40" y="394" width="1120" height="44" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="64" y="422" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#134E4A">Turchin 1991: the four layers are specialised configurations of one reflective engine, not four programs passing files.</text>
</svg>
