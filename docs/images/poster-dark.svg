  <text x="60" y="534" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">The two generations are compared byte for byte. Equal output is the claim; a supercompiler that merely re-prints its input would pass it trivially, so the emitted program is also run.</text>
  <rect x="40" y="592" width="1120" height="44" rx="12" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <text x="64" y="620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#99F6E4">Every column is a crate and a command; every command is behind a test. The compiler in Refal lives in the corpus because it is the artifact under test, not the verifier.</text>
</svg>
