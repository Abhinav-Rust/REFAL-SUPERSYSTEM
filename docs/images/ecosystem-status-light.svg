<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 828" width="1200" height="828" role="img" aria-labelledby="t d">
  <title id="t">Current capability status</title>
  <desc id="d">Language and runtime: Implemented. Programs run; Classic syntax has a clause corpus. Symbolic reflection: Implemented. Entry configurations and successors are exposed. Compiler / supercompiler: Needs repair. Real transformations; wrong-code cases remain. Self-hosting: Demonstrated. The Refal compiler compiles its own source. Proofs and certificates: Needs repair. False proof and termination verdicts reproduced. Function inversion: Needs repair. A synthesized inverse fails a valid round trip. Higher projections: Not established. Required compiler-generation stages are unproven. Knowledge network: Not started. Shared concepts, provenance, and review are in scope.</desc>
