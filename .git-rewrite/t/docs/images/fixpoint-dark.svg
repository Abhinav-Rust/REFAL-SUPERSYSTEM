<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="fix-title fix-desc">
  <title id="fix-title">The compiler compiles its own source and the output is a fixpoint</title>
  <desc id="fix-desc">Three stages: the compiler's own 152 KB source, compiled once to gen1.ref, then compiled again to gen2.ref. A verdict band states that the two are identical byte for byte at 111,600 bytes, and that this is a supercompilation rather than a re-print.</desc>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="#0D1117" stroke="#30363D"/>

  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#2DD4BF">SELF-APPLICATION</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#E6EDF3">The compiler compiles its own source &#8212; and the output is a fixpoint</text>

  <line x1="40" y1="112" x2="1160" y2="112" stroke="#30363D" stroke-width="1"/>

  <g>
    <rect x="70" y="146" width="240" height="104" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <text x="190" y="176" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8B949E">THE COMPILER&#8217;S OWN SOURCE</text>
    <text x="190" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#E6EDF3">compiler.ref</text>
    <text x="190" y="230" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">a compiler written in Refal &#183; 152 KB</text>
  </g>

  <g stroke="#2DD4BF" stroke-width="1.8" fill="none">
    <path d="M 316 198 L 424 198"/><path d="M 414 192 L 425 198 L 414 204"/>
    <path d="M 686 198 L 794 198"/><path d="M 784 192 L 795 198 L 784 204"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#2DD4BF" text-anchor="middle">
    <text x="370" y="186">COMPILE</text>
    <text x="740" y="186">COMPILE AGAIN</text>
  </g>

  <g>
    <rect x="430" y="146" width="250" height="104" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
    <text x="555" y="176" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#5EEAD4">THE DRIVEN RESIDUE</text>
    <text x="555" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#E6EDF3">gen1.ref</text>
    <text x="555" y="230" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">the interpreter eliminated</text>
  </g>

  <g>
    <rect x="800" y="146" width="250" height="104" rx="12" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
    <text x="925" y="176" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#5EEAD4">THE RESIDUE OF THE RESIDUE</text>
    <text x="925" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#E6EDF3">gen2.ref</text>
    <text x="925" y="230" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">nothing left to drive</text>
  </g>

  <g>
    <rect x="70" y="262" width="1060" height="46" rx="12" fill="#062925" stroke="#0F766E" stroke-width="1.5"/>
    <circle cx="98" cy="285" r="9" fill="#2DD4BF"/>
    <path d="M 93.5 285 L 96.5 288 L 102.5 281" stroke="#0D1117" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="284" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5EEAD4">gen1 == gen2, byte for byte &#8212; 111,600 bytes.</text>
    <text x="118" y="302" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#CCFBF1">And it is a supercompilation, not a re-print: the output&#8217;s entry is a generated <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5EEAD4">Split</tspan>, not the original dispatch.</text>
  </g>
</svg>
