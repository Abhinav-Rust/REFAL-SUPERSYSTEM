<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d">
  <title id="t">What each layer does</title>
  <desc id="d">A stack of five layers, L0 to L4: the Refal-5 machine, the reflection engine and the supercompiler core are built; the meta-prover and self-application are partial.</desc>
  <rect x="0.5" y="0.5" width="1199" height="679" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#0F766E">WHAT EACH LAYER DOES</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#1F2328">One engine, four layers — each layer's subject is the layer below it</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#D0D7DE" stroke-width="1"/>
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0FDFA"/>
      <stop offset="0.55" stop-color="#F6FEFC"/>
    </linearGradient>
    <linearGradient id="gpart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="0.55" stop-color="#F6FEFC"/>
    </linearGradient>
  </defs>
  <rect x="40" y="136" width="1120" height="88" rx="14" fill="url(#gok)" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="136" width="6" height="88" rx="3" fill="#0F766E"/>
  <rect x="64" y="154" width="52" height="52" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="90" y="186" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" text-anchor="middle" fill="#0F766E">L0</text>
  <text x="136" y="172" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">Refal-5 machine</text>
  <text x="136" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">Runs Refal: pattern matching, term splicing, arithmetic and I/O. The state is one flat view</text>
  <text x="136" y="213" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">field held as a rope of shared arenas, so a variable binds a range of it rather than a copy.</text>
  <rect x="980" y="154" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="1000" cy="168" r="5" fill="#0F766E"/>
  <text x="1016" y="173" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E">Built</text>
  <rect x="980" y="190" width="160" height="8" rx="4" fill="#E6EDF3"/>
  <rect x="980" y="190" width="160.0" height="8" rx="4" fill="#0F766E"/>
  <rect x="40" y="232" width="1120" height="88" rx="14" fill="url(#gok)" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="232" width="6" height="88" rx="3" fill="#0F766E"/>
  <rect x="64" y="250" width="52" height="52" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="90" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" text-anchor="middle" fill="#0F766E">L1</text>
  <text x="136" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">Reflection engine</text>
  <text x="136" y="292" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">Freezes an expression as inert data, inspects it with ordinary pattern matching, and thaws it</text>
  <text x="136" y="309" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">back. Constructs symbolic execution graphs.</text>
  <rect x="980" y="250" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="1000" cy="264" r="5" fill="#0F766E"/>
  <text x="1016" y="269" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E">Built</text>
  <rect x="980" y="286" width="160" height="8" rx="4" fill="#E6EDF3"/>
  <rect x="980" y="286" width="160.0" height="8" rx="4" fill="#0F766E"/>
  <rect x="40" y="328" width="1120" height="88" rx="14" fill="url(#gok)" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="328" width="6" height="88" rx="3" fill="#0F766E"/>
  <rect x="64" y="346" width="52" height="52" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="90" y="378" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" text-anchor="middle" fill="#0F766E">L2</text>
  <text x="136" y="364" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">Supercompiler core</text>
  <text x="136" y="388" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">Drives a configuration into a graph of states, whistles on divergence, generalises</text>
  <text x="136" y="405" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">least-generally, folds loops, and emits a residual program.</text>
  <rect x="980" y="346" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <circle cx="1000" cy="360" r="5" fill="#0F766E"/>
  <text x="1016" y="365" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E">Built</text>
  <rect x="980" y="382" width="160" height="8" rx="4" fill="#E6EDF3"/>
  <rect x="980" y="382" width="160.0" height="8" rx="4" fill="#0F766E"/>
  <rect x="40" y="424" width="1120" height="88" rx="14" fill="url(#gpart)" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="424" width="6" height="88" rx="3" fill="#B45309"/>
  <rect x="64" y="442" width="52" height="52" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="90" y="474" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" text-anchor="middle" fill="#B45309">L3</text>
  <text x="136" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">Meta-prover</text>
  <text x="136" y="484" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">Accepts assertions or relational functions and decides equivalence by complete tree reduction:</text>
  <text x="136" y="501" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">refal prove drives a predicate to Turchin's single terminal 'True'.</text>
  <rect x="980" y="442" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="1000" cy="456" r="5" fill="#B45309"/>
  <text x="1016" y="461" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B45309">Partial</text>
  <rect x="980" y="478" width="160" height="8" rx="4" fill="#E6EDF3"/>
  <rect x="980" y="478" width="112.0" height="8" rx="4" fill="#B45309"/>
  <rect x="40" y="520" width="1120" height="88" rx="14" fill="url(#gpart)" stroke="#CCE8E2" stroke-width="1.5"/>
  <rect x="40" y="520" width="6" height="88" rx="3" fill="#B45309"/>
  <rect x="64" y="538" width="52" height="52" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="90" y="570" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" text-anchor="middle" fill="#B45309">L4</text>
  <text x="136" y="556" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1F2328">Self-application</text>
  <text x="136" y="580" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">The engine applied to itself: a compiler that compiles its own source, and a generator that</text>
  <text x="136" y="597" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57606A">emits a compiler.</text>
  <rect x="980" y="538" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="1000" cy="552" r="5" fill="#B45309"/>
  <text x="1016" y="557" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B45309">Partial</text>
  <rect x="980" y="574" width="160" height="8" rx="4" fill="#E6EDF3"/>
  <rect x="980" y="574" width="112.0" height="8" rx="4" fill="#B45309"/>
  <rect x="40" y="620" width="1120" height="44" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="64" y="648" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#134E4A">Built means every behaviour of the layer carries a green gate; Partial means a named behaviour is still open. Statuses are those of docs/TURCHIN-ECOSYSTEM-CONFORMANCE.md.</text>
</svg>
