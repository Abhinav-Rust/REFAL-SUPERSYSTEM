<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Who this is for</title>
  <desc id="d">Four cards: compiler engineers get rewrite rules, researchers get an implemented model, AI developers get a deterministic symbolic layer, and application developers get declarative rules.</desc>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="40" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.2" fill="#0F766E">WHO THIS IS FOR</text>
  <text x="40" y="90" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.3" fill="#E6EDF3">Four readers — and the one reason each should care</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="#30363D" stroke-width="1"/>
  <rect x="40" y="140" width="272" height="172" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="40" y="140" width="272" height="5" rx="2.5" fill="#0F766E"/>
  <text x="60" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.0" fill="#0F766E">COMPILER &amp; TOOLING</text>
  <text x="60" y="195" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.0" fill="#0F766E">ENGINEERS</text>
  <text x="60" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#E6EDF3">Rewrite rules, not walkers</text>
  <text x="60" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">source-to-source transformations,</text>
  <text x="60" y="261" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">normalisation passes and</text>
  <text x="60" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">optimisers written as rewrite</text>
  <text x="60" y="291" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">rules</text>
  <rect x="328" y="140" width="272" height="172" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="328" y="140" width="272" height="5" rx="2.5" fill="#0F766E"/>
  <text x="348" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.0" fill="#0F766E">LANGUAGE RESEARCHERS</text>
  <text x="348" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#E6EDF3">An implemented model</text>
  <text x="348" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">a compact, running model for term</text>
  <text x="348" y="261" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">rewriting, partial evaluation and</text>
  <text x="348" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">supercompilation</text>
  <rect x="616" y="140" width="272" height="172" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="616" y="140" width="272" height="5" rx="2.5" fill="#0F766E"/>
  <text x="636" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.0" fill="#0F766E">AI &amp; AUTOMATION DEVELOPERS</text>
  <text x="636" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#E6EDF3">A symbolic layer for AI</text>
  <text x="636" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">parse model output, validate tool</text>
  <text x="636" y="261" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">calls, rewrite plans and check</text>
  <text x="636" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">rule-based constraints exactly</text>
  <rect x="904" y="140" width="272" height="172" rx="14" fill="#0B1B19" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="904" y="140" width="272" height="5" rx="2.5" fill="#0F766E"/>
  <text x="924" y="178" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.0" fill="#0F766E">APPLICATION DEVELOPERS</text>
  <text x="924" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#E6EDF3">Declarative rules</text>
  <text x="924" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">DSLs, templates, workflows and</text>
  <text x="924" y="261" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">business rules described</text>
  <text x="924" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">declaratively, not in ad hoc</text>
  <text x="924" y="291" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8B949E">string code</text>
  <rect x="40" y="324" width="1120" height="44" rx="12" fill="#062925" stroke="#134E4A" stroke-width="1.5"/>
  <text x="64" y="352" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#99F6E4">Neural models generate and discover patterns; production systems still need exact, inspectable transformations. This is a tool for that part of the problem.</text>
</svg>
