[package]
name = "refal-semantics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
refal-ast = { path = "../refal-ast" }

# The feasibility tests parse Refal source, so the analyser's own gates run on
# real programs rather than on hand-built trees. `refal-syntax` depends only on
# `refal-ast`, so this is a test-only edge and not a cycle.
[dev-dependencies]
refal-syntax = { path = "../refal-syntax" }

[lib]
path = "src/lib.rs"

[lints]
workspace = true

