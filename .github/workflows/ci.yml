name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an in-flight run cancels it. The branch's newest commit
# is the only one whose verdict still matters, and this suite is long enough that
# a stale run would otherwise hold a runner for up to 90 minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is serial by construction (`--test-threads=1`) because four of
    # its tests compile the compiler with the Refal-authored compiler, and the
    # workspace does not tolerate them running concurrently.
    #
    # `--profile test-fast` is `release` code generation with `debug-assertions`
    # and `overflow-checks` kept (see the workspace `Cargo.toml`): the runtime is
    # dominated by *running* tests, not by building, so an optimised binary is the
    # biggest lever. It is a 1.72x saving on the measured sweep, and the profile is
    # behaviourally identical to `dev`, so nothing the gates check is weakened.
    #
    # The timeout is a backstop for a *hung* run, not a budget for a slow one, so
    # it wants a comfortable multiple of the real time rather than a tight fit.
    # Measured at 10m45s on the runner under `test-fast` (down from 50m28s in
    # `dev`), which makes 45 minutes roughly a 4x margin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --profile test-fast --all -j 2 -- --test-threads=1
